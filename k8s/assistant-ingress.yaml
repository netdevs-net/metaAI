apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assistant-ingress
  namespace: metaisploit
spec:
  rules:
    - host: metaisploit.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assistant-api
                port:
                  number: 8080
