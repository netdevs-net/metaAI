services:
  metaisploit-assistant:
    build: .
    container_name: metaisploit-assistant
    tty: true
    stdin_open: true
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - METASPLOIT_ROOT=/opt/metasploit-framework
      - GPT4ALL_MODEL_PATH=/app/models
    ports:
      - "8080:8080"
      - "6006:6006"
    depends_on:
      - metasploit
    networks:
      - metasploit-net

  metasploit:
    image: metasploitframework/metasploit-framework
    container_name: metasploit
    tty: true
    stdin_open: true
    env_file:
      - .env-dev
    depends_on:
      - db

    entrypoint: /docker/init-msf-db.sh
    command: /bin/bash -c "cd /usr/src/metasploit-framework && ./msfconsole -r docker/msfconsole.rc"
    volumes:
      - ./data:/data
      - msf4_config:/root/.msf4
      - ./docker/msfconsole.rc:/usr/src/metasploit-framework/docker/msfconsole.rc
      - ./docker/msgrpc.rc:/usr/src/metasploit-framework/docker/msgrpc.rc
      - ./docker/init-msf-db.sh:/docker/init-msf-db.sh
    networks:
      - metasploit-net

  db:
    image: postgres:14
    container_name: metasploit-db
    environment:
      POSTGRES_USER: msf
      POSTGRES_PASSWORD: Meta2025SecurePass
      POSTGRES_DB: msf
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - metasploit-net

  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    ports:
      - "8081:80"
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_PASSWORD=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_DATABASE=dvwa
    networks:
      - metasploit-net
    restart: unless-stopped

networks:
  metasploit-net:
    driver: bridge

volumes:
  pgdata:
  msf4_config:
    driver: local
