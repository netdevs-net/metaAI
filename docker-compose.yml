services:
  metaisploit-assistant:
    build: .
    container_name: metaisploit-assistant
    tty: true
    stdin_open: true
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - METASPLOIT_ROOT=/opt/metasploit-framework
      - GPT4ALL_MODEL_PATH=/app/models
      # Metasploit RPC settings
      - MSF_SERVER=metasploit
      - MSF_PORT=55552
      - MSF_USER=msf
      - MSF_PASS=${MSGRPC_PASS:-Meta2025SecurePass}
      - MSF_SSL=false
    ports:
      - "8080:8080"
      - "6006:6006"
    depends_on:
      metasploit:
        condition: service_healthy
    networks:
      - metasploit-net
    healthcheck:
      test: ["CMD", "python3", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  metasploit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metasploit
    tty: true
    stdin_open: true
    env_file:
      - .env-dev
    environment:
      # Database configuration
      - POSTGRES_USER=msf
      - POSTGRES_PASSWORD=Meta2025SecurePass
      - POSTGRES_DB=msf
      - POSTGRES_HOST=db
      # Metasploit RPC configuration
      - MSGRPC_PASS=${MSGRPC_PASS:-Meta2025SecurePass}
      - MSF_DATABASE_CONFIG=/usr/src/metasploit-framework/config/database.yml
    depends_on:
      db:
        condition: service_healthy
    # Run as root to allow database initialization
    user: root
    # Entrypoint and command
    entrypoint: /bin/bash
    command: -c "chmod +x /app/docker/entrypoint.sh && /app/docker/entrypoint.sh"
    # Required volumes
    volumes:
      # Mount the RC files
      - ./docker/msfconsole.rc:/usr/src/metasploit-framework/docker/msfconsole.rc
      - ./docker/msgrpc.rc:/usr/src/metasploit-framework/msgrpc.rc
      # Mount the entrypoint script
      - ./docker/entrypoint.sh:/app/docker/entrypoint.sh
      # Persist Metasploit data
      - msf4_data:/root/.msf4
      # Mount the app directory
      - .:/app
    healthcheck:
      test: ["CMD", "pgrep", "-f", "msfrpcd"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - metasploit-net

  db:
    image: postgres:14
    container_name: metasploit-db
    environment:
      POSTGRES_USER: msf
      POSTGRES_PASSWORD: Meta2025SecurePass
      POSTGRES_DB: msf
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msf -d msf"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - metasploit-net

  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    ports:
      - "8081:80"
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_PASSWORD=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_DATABASE=dvwa
    networks:
      - metasploit-net
    restart: unless-stopped

networks:
  metasploit-net:
    driver: bridge

volumes:
  pgdata:  # PostgreSQL data volume
  msf4_data:  # Metasploit configuration and data
    driver: local
